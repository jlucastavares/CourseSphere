# CourseSphere: Nginx (frontend + balanceador) na frente de 2 instâncias
# do backend, com Redis compartilhado para o rate limiting.
#
#   docker compose up --build      ->  http://localhost:8080

name: coursesphere

x-backend-env: &backend-env
  FIREBASE_CREDENTIALS: /run/secrets/firebase_credentials
  CORS_ORIGINS: http://localhost:8080
  TRUST_PROXY: "1"
  FLASK_DEBUG: "0"
  # Contadores de rate limit compartilhados: o limite vale para o
  # conjunto das instâncias, e não para cada uma separadamente.
  RATELIMIT_STORAGE_URI: redis://redis:6379

x-backend: &backend
  build: ./backend
  image: coursesphere-backend
  restart: unless-stopped
  secrets:
    - firebase_credentials
  expose:
    - "5000"                       # acessível só pela rede interna
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s
  # Hardening do container
  read_only: true
  tmpfs:
    - /tmp
    - /home/appuser                # o Gunicorn cria arquivos de controle aqui
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  backend-1:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_NAME: backend-1

  backend-2:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_NAME: backend-2

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    read_only: true
    security_opt:
      - no-new-privileges:true

  nginx:
    build: ./frontend
    image: coursesphere-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"                # única porta exposta para fora
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

secrets:
  firebase_credentials:
    file: ./backend/credentials.json
