# Nginx: serve o frontend e balanceia a API entre as instâncias do backend.

# Log de acesso em JSON. "upstream" mostra qual instância atendeu cada
# requisição, o que serve de evidência do balanceamento.
log_format json_lb escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","client_ip":"$remote_addr",'
  '"method":"$request_method","uri":"$uri","status":$status,'
  '"upstream":"$upstream_addr","instance":"$upstream_http_x_instance",'
  '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

# Pool de backends. O algoritmo padrão é round-robin (alterna entre eles).
# Uma instância que falha 3 vezes fica fora do pool por 10 s (failover).
upstream backend_pool {
    server backend-1:5000 max_fails=3 fail_timeout=10s;
    server backend-2:5000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    access_log /dev/stdout json_lb;
    server_tokens off;              # não revela a versão do Nginx
    client_max_body_size 256k;      # mesmo limite do backend

    # Bloqueia o acesso externo às métricas internas do backend.
    location = /api/metrics {
        return 404;
    }

    # API: /api/... é repassado aos backends sem o prefixo /api.
    location /api/ {
        proxy_pass http://backend_pool/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # IP real do usuário
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;       # mesmo ID no Nginx e no backend

        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        # Se uma instância cair, tenta a outra (apenas falhas de conexão
        # e indisponibilidade; POST não é repetido por padrão).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Frontend (single-page app): rotas desconhecidas voltam para o index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;

        # Headers de segurança do site.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP: scripts só do próprio site; conexões só com a própria API e
        # com os serviços de autenticação do Firebase. 'unsafe-inline' em
        # style-src é exigido pela biblioteca de componentes (MUI/Emotion).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com; frame-src https://*.firebaseapp.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
