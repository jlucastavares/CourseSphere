# Verificação de segurança automatizada a cada push e pull request.
#
#   - Testes: 42 testes de segurança, observabilidade e regressão (pytest)
#   - SAST:   Bandit (análise estática do código Python)
#   - SCA:    pip-audit (dependências Python) e npm audit (dependências do frontend)
#
# Os relatórios ficam disponíveis como artefatos de cada execução.

name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Menor privilégio: o workflow só precisa ler o repositório.
permissions:
  contents: read

jobs:
  tests:
    name: Testes automatizados (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  sast-bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Relatório completo
        run: bandit -r . -x ./tests,./venv,./cornell-course-sphere-data -f txt -o bandit-report.txt || true
      - name: Falha se houver problema de severidade alta
        run: bandit -r . -x ./tests,./venv,./cornell-course-sphere-data --severity-level high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.txt

  sca-python:
    name: SCA - pip-audit (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Dependências Python com vulnerabilidades conhecidas
        run: pip-audit -r requirements.txt --progress-spinner off 2>&1 | tee pip-audit-report.txt
        shell: bash -o pipefail {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.txt

  frontend-build:
    name: Build do frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Checagem de tipos (TypeScript) e build de produção
        run: npm run build
        env:
          VITE_API_URL: /api

  sca-node:
    name: SCA - npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Dependências npm com vulnerabilidades conhecidas
        # Não bloqueia o pipeline: as vulnerabilidades atuais vêm da cadeia
        # do SDK do Firebase e estão documentadas no relatório (VULN-09).
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee npm-audit-report.txt
        shell: bash -o pipefail {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.txt
